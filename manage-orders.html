
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders | Chapter One</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">chapterone.</div>

        <nav>
            <a href="admin.html">Dashboard</a>
            <a href="index.html">Visit Store</a>
        </nav>
    </header>

    <main class="manage-orders-page">

        <div class="manage-orders-heading">
            <div>
                <h1>Manage Orders</h1>
                <p>View and manage customer orders.</p>
            </div>
        </div>

        <div class="order-stats">
            <div class="order-stat-card">
                <h3>Total Orders</h3>
                <p id="adminTotalOrders">0</p>
            </div>

            <div class="order-stat-card">
                <h3>Processing</h3>
                <p id="adminProcessingOrders">0</p>
            </div>

            <div class="order-stat-card">
                <h3>Shipped</h3>
                <p id="adminShippedOrders">0</p>
            </div>

            <div class="order-stat-card">
                <h3>Delivered</h3>
                <p id="adminDeliveredOrders">0</p>
            </div>
        </div>

        <div class="manage-orders-container">

            <div class="manage-orders-toolbar">
                <input
                    type="text"
                    id="orderSearch"
                    placeholder="Search by customer name or email..."
                >

                <select id="orderStatusFilter">
                    <option value="">All Orders</option>
                    <option value="Order Placed">Order Placed</option>
                    <option value="Processing">Processing</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>

            <div id="manageOrdersMessage"></div>

            <div id="manageOrdersList">
                <p>Loading orders...</p>
            </div>

        </div>

        <a href="admin.html" class="back-dashboard">
            ← Back to Dashboard
        </a>

    </main>

    <script src="manage-orders.js"></script>

</body>
</html>
